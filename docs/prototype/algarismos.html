@import url("https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap");

@property --h { syntax: "<number>"; inherits: true; initial-value: 168; }

:root {
  --h: 168;
  --bg: oklch(94.5% 0.045 var(--h));
  --bg-2: oklch(89% 0.085 calc(var(--h) + 28));
  --ink: oklch(23% 0.035 var(--h));
  --muted: oklch(45% 0.035 var(--h));
  --line: oklch(23% 0.035 var(--h) / 0.2);
  --accent: oklch(47% 0.13 var(--h));
  --on-accent: oklch(98% 0.012 var(--h));
  --key: oklch(100% 0 0 / 0.52);
  --ghost: oklch(47% 0.13 var(--h) / 0.1);
  --bad: oklch(48% 0.19 28);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: --h 0.9s ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(19% 0.035 var(--h));
    --bg-2: oklch(28% 0.085 calc(var(--h) + 28));
    --ink: oklch(95% 0.02 var(--h));
    --muted: oklch(74% 0.035 var(--h));
    --line: oklch(95% 0.02 var(--h) / 0.2);
    --accent: oklch(82% 0.12 var(--h));
    --on-accent: oklch(18% 0.035 var(--h));
    --key: oklch(100% 0 0 / 0.07);
    --ghost: oklch(82% 0.12 var(--h) / 0.08);
    --bad: oklch(76% 0.15 28);
  }
}
:root[data-theme="dark"] {
  --bg: oklch(19% 0.035 var(--h));
  --bg-2: oklch(28% 0.085 calc(var(--h) + 28));
  --ink: oklch(95% 0.02 var(--h));
  --muted: oklch(74% 0.035 var(--h));
  --line: oklch(95% 0.02 var(--h) / 0.2);
  --accent: oklch(82% 0.12 var(--h));
  --on-accent: oklch(18% 0.035 var(--h));
  --key: oklch(100% 0 0 / 0.07);
  --ghost: oklch(82% 0.12 var(--h) / 0.08);
  --bad: oklch(76% 0.15 28);
}

*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
p, h2 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* \u2500\u2500 Palco e fundo \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.stage {
  position: relative; min-height: 100%; overflow: hidden;
  background: radial-gradient(130% 75% at 88% -5%, var(--bg-2), transparent 62%), var(--bg);
}
.ghost {
  position: absolute; right: -0.04em; bottom: -0.1em; z-index: 0;
  font: 600 clamp(20rem, 105vmin, 62rem) / 0.74 var(--math);
  color: var(--ghost); pointer-events: none; user-select: none;
  transition: transform 1s cubic-bezier(0.2, 0.7, 0.1, 1);
}
[data-level="medium"] .ghost { transform: translate(-10%, -26%) rotate(-9deg); }
[data-level="hard"] .ghost { transform: translate(-22%, -48%) rotate(13deg) scale(1.18); }

.col {
  position: relative; z-index: 1;
  width: min(100%, 31rem); margin: 0 auto;
  padding: 1rem 1.25rem 1.5rem;
  display: flex; flex-direction: column;
}
@media (min-width: 62rem) {
  .col { margin-left: max(7vw, calc(50vw - 36rem)); padding-top: 2rem; }
}
.lead { margin-top: 30vh; font-size: 1.05rem; color: var(--muted); }

/* \u2500\u2500 Cabe\xE7alho e n\xEDveis \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-size: 0.875rem; color: var(--muted); }
.brand { font: italic 400 1.3rem/1 var(--math); color: var(--ink); letter-spacing: -0.01em; }
.levels { display: flex; gap: 1.5rem; margin-top: 1.5rem; border-bottom: 1px solid var(--line); }
.level {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.6rem 0; margin-bottom: -1px; min-height: 44px;
  font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent;
}
.level[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tick { width: 0.9rem; height: 0.9rem; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* \u2500\u2500 Enunciado \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.brief { margin-top: clamp(1rem, 3.5vh, 2rem); }
.ask { font-size: 1.0625rem; color: var(--muted); }
.target {
  font: 600 clamp(4.5rem, 21vw, 7rem) / 0.95 var(--math);
  letter-spacing: -0.035em; margin: 0.04em 0 0.1em -0.03em;
  font-variant-numeric: lining-nums;
}
.tiles { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.75rem; }
.tile {
  display: grid; place-items: center; width: 2rem; height: 2.25rem; border-radius: 0.5rem;
  font: 600 1.2rem/1 var(--math);
  background: var(--accent); color: var(--on-accent);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.tile.used { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.extra { font-weight: 600; color: var(--bad); margin-left: 0.2rem; }
.tiles.over .tile { box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }

/* \u2500\u2500 Editor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.editor {
  display: flex; align-items: center; gap: 0.75rem;
  margin-top: clamp(1rem, 3vh, 1.75rem); min-height: 6.25rem;
  border-bottom: 2px solid var(--ink);
  font: 400 clamp(1.9rem, 8.2vw, 2.6rem) / 1.25 var(--math);
  cursor: text; outline: none; touch-action: manipulation;
}
.editor:focus-visible { border-bottom-color: var(--accent); }
.editor.solved { cursor: default; border-bottom-color: var(--accent); }
.scroll { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; padding: 0.5em 0; }
.scroll::-webkit-scrollbar { display: none; }
.expr { position: relative; margin: auto 0; padding-right: 0.4em; white-space: nowrap; }
.hint { margin-left: 0.5rem; vertical-align: middle; font: 400 1rem var(--ui); color: var(--muted); pointer-events: none; }
.value { flex: none; font-size: 0.56em; color: var(--muted); font-variant-numeric: tabular-nums; }
.value.hit { color: var(--accent); font-weight: 600; }

.row { display: inline-block; white-space: nowrap; min-width: 0.3em; min-height: 1em; }
.tk { display: inline-block; }
.tk.op { margin: 0 0.24em; }
.frac { display: inline-grid; grid-template-rows: 1fr auto 1fr; justify-items: center; vertical-align: middle; margin: 0 0.1em; }
.frac .frac { font-size: 0.86em; }
.num { align-self: end; padding: 0 0.18em 0.06em; }
.den { align-self: start; padding: 0.06em 0.18em 0; }
.bar { justify-self: stretch; border-top: 0.055em solid currentColor; }
.pow { display: inline-block; font-size: 0.62em; vertical-align: 0.82em; margin-left: 0.06em; }
.pow.hi { vertical-align: top; }
.sqrt, .group { display: inline-flex; align-items: stretch; }
.sqrt { margin: 0 0.06em; }
.sqrt-body { align-self: baseline; border-top: 0.055em solid currentColor; padding: 0.1em 0.12em 0 0.08em; }
.group-body { align-self: baseline; padding: 0.04em 0.02em; }
.stretch { position: relative; flex: none; }
.stretch svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stretch path { fill: none; stroke: currentColor; stroke-width: 0.055em; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rad { width: 0.58em; }
.paren { width: 0.3em; }
.paren.r { transform: scaleX(-1); }

.caret { display: inline-block; width: 0; height: 1.05em; vertical-align: -0.2em; position: relative; }
.caret::after { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
.editor:not(:focus) .caret::after { animation: none; opacity: 0.45; }
.empty { display: inline-block; width: 0.6em; height: 0.84em; vertical-align: -0.08em; border: 1.5px dashed var(--line); border-radius: 0.12em; }
.empty.on { border: 1.5px solid var(--accent); background: color-mix(in oklch, var(--accent) 14%, transparent); }
@keyframes blink { 50% { opacity: 0; } }

.status { min-height: 1.4rem; margin-top: 0.5rem; font-size: 0.9375rem; line-height: 1.4; color: var(--muted); }
.status.bad { color: var(--bad); }

/* \u2500\u2500 Teclado \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
.key {
  display: grid; place-items: center; height: clamp(3rem, 7.4vh, 3.6rem); border-radius: 0.9rem;
  background: var(--key); font: 400 1.5rem/1 var(--math);
  transition: transform 0.08s, background 0.15s;
}
.key:active { transform: scale(0.94); }
.key svg { width: 1.6rem; height: 1.6rem; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.key.digit { background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 1.75rem; }
.key.locked { opacity: 0.32; }
.link { grid-column: span 1; height: 3.25rem; margin-top: 0.25rem; font-weight: 500; color: var(--muted); border-radius: 0.9rem; }
.link:disabled { opacity: 0.4; cursor: default; }
.primary {
  grid-column: span 3; height: 3.25rem; margin-top: 0.25rem; padding: 0 1.5rem; border-radius: 0.9rem;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 1.0625rem;
  transition: transform 0.08s;
}
.primary:active { transform: scale(0.98); }

/* \u2500\u2500 Resolvido \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.done { margin-top: 1rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.1, 1); }
.done h2 { font: 600 1.75rem/1.15 var(--math); letter-spacing: -0.01em; }
.done p { color: var(--muted); line-height: 1.5; }
.done .primary { margin-top: 0.75rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  :root, .ghost, .tile, .key, .primary { transition: none; }
  .caret::after, .done { animation: none; }
}
